name: Hourly lake conditions

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (off the top of the hour, when GitHub's scheduler is busiest)
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours to look back (168 = backfill a week)"
        default: "6"

concurrency:
  group: hourly-lake-conditions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet boto3
      - name: Fetch, archive, publish
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: python fetch.py --hours "${{ github.event.inputs.hours || '6' }}" --upload s3
      - name: Commit the new readings
        run: |
          git config user.name "lake-conditions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history state
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Readings $(date -u +%Y-%m-%dT%H:00Z)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
